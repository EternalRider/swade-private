      AmmoSettings:
        Title: Ustawienia Amunicji
        Content: Kontrolują one czy amunicja jest automatycznie zużywana przez broń
          zasięgową.
      AmmoManagement:
        Title: Zarządzanie Amunicją
        Content: To ustawienie kontroluje, czy użycie broni dystansowej zużywa jakąkolwiek
          amunicję, zarówno z wewnętrznego licznika strzałów broni, jak i z ekwipunku.
      PCInventory:
        Title: Amunicja z Ekwipunku
        Content: Kolejne trzy ustawienia kontrolują, czy przy przeładowaniu broni
          zużywane są zewnętrzne przedmioty, w zależności od typu aktora. Jeśli te
          opcje są odznaczone, ale zarządzanie amunicją jest włączone, aktorzy danego
          typu będą zużywać strzały z przedmiotu, ale będą mogły swobodnie przeładowywać.
          Pozwala to na styl zarządzania amunicją w stylu arcade, gdzie ważne jest
          śledzenie samego przeładowania, ale długoterminowe zużycie amunicji nie
          ma znaczenia.
      CharacterWeapons:
        Title: Broń Postaci
        Content: Lista broni postaci znajduje się w zakładce Sprzęt.
      ReloadNone:
        Title: Typ Przeładowania — brak
        Content: Ta broń całkowicie ignoruje licznik strzałów, pobierając amunicję
          bezpośrednio z powiązanego przedmiotu. To ustawienie najlepiej sprawdza
          się w przypadku broni korzystających wyłącznie z zewnętrznej amunicji, takich
          jak kołczan ze strzałami czy karabin bębenkowy.
      AmmoNone:
        Title: Pole Amunicji
        Content: To ustawienie powinno być przypisane do przedmiotu wyposażenia (np.
          strzały) lub przedmiotu zużywalnego (np. beczka z nabojami) w ekwipunku
          postaci. Ilość przedmiotów wyposażenia jest zużywana bezpośrednio. W przypadku
          przedmiotów zużywalnych, zużywane są ich ładunki, przy czym każda ilość
          reprezentuje pełny zestaw ładunków. Nazwa w tym polu musi <em>dokładnie</em>
          odpowiadać nazwie przedmiotu, który ma być zużyty.
      ReloadSelf:
        Title: Typ Przeładowania — Własne
        Content: Te bronie używają własnej ilości do resetowania licznika strzałów.
          To ustawienie najlepiej sprawdza się w przypadku broni rzucanych lub innych
          przedmiotów, które są samowystarczalne i zużywają się podczas użycia.
      AmmoSelf:
        Title: Pole Amunicji
        Content: To pole jest ignorowane, gdy typ przeładowania jest ustawiony na
          własne
      ReloadSingle:
        Title: Typ Przeładowania — Pojedyncze
        Content: Te bronie przeładowują pojedynczy strzał przy każdym naciśnięciu
          przycisku Przeładowania. To ustawienie jest idealne dla rewolwerów lub innych
          broni z ciężką amunicją, które przeładowuje się powoli.
      AmmoSingle:
        Title: Pole Amunicji
        Content: To pole działa podobnie do Przeładuj — brak, ale ilość lub ładunki
          są zużywane podczas przeładowania, a nie podczas strzelania, ponieważ strzelanie
          zużywa liczbę strzałów w liczniku.
      ReloadFull:
        Title: Typ Przeładowania — Pełne
        Content: Ta broń resetują cały licznik strzałów przy każdym naciśnięciu przycisku
          Przeładowania. To ustawienie może być używane jako uproszczona wersja metody
          magazynków lub dla broni, które nie mają wymiennych magazynków, takich jak
          broń z rezerwuarami cieczy.
      AmmoFull:
        Title: Pole Amunicji
        Content: To pole działa podobnie do Przeładuj — brak, ale ilość lub ładunki
          są zużywane podczas przeładowania, zamiast podczas strzelania, ponieważ
          strzelanie zużywa licznik strzałów.
      ReloadMagazine:
        Title: Typ Przeładowania — Magazynek
        Content: Te bronie używają w pełni wymiennych magazynków, które można zamieniać
          w razie potrzeby, śledząc liczbę strzałów pozostałych w każdym magazynku.
      AmmoMagazine:
        Title: Pole Amunicji
        Content: Przedmiot nazwany tutaj MUSI być przedmiotem zużywalnym z podtypem
          Magazynek, aby działał poprawnie. Ponadto, ładunki przedmiotu zużywalnego
          powinny odpowiadać licznikowi strzałów broni.
      ReloadBattery:
        Title: Typ Przeładowania — Bateria
        Content: Ta broń działa podobnie do magazynków, ale z wymiennymi akumulatorami,
          które są zużywane proporcjonalnie do liczby oddanych strzałów.
      AmmoBattery:
        Title: Pole Amunicji
        Content: Przedmiot nazwany tutaj MUSI być przedmiotem zużywalnym z podtypem
          Bateria, aby działał poprawnie. Ponadto maksymalna liczba ładunków przedmiotu
          zużywalnego powinna wynosić 100.
      ReloadPP:
        Title: Typ Przeładowania — Punkty Mocy
        Content: Te bronie nie przeładowują się fizyczną amunicją, lecz poprzez wyczerpywanie
          punktów mocy posiadacza, jak to ma miejsce w <em>Rifts® for Savage Worlds</em>
      AmmoPP:
        Title: Pole Amunicji
        Content: Zamiast podawać nazwę przedmiotu, wskaż ważny typ Umiejętności Nadprzyrodzonej
          postaci, taki jak Ogólne, Magia, Cuda czy Psionika
    TWEAKS:
      Title: Poprawki
      Description: Naucz się unikalnych modyfikacji karty w menu Poprawek
      Actor: Przewodnik po Poprawkach Demonstracyjna Postać
      AccessTweaks:
        Title: Dostęp do Poprawek
        Content: Menu Poprawek znajduje się w nagłówku każdego arkusza postaci i oferuje
          dodatkowe opcje konfiguracyjne
      TraitTweaks:
        Title: Poprawki Cech
        Content: Ta zakładka oferuje szeroki zestaw dodatkowych pól, które umożliwiają
          dostosowanie Cech postaci
      Advances:
        Title: Rodzaj Rozwinięć
        Content: Rozszerzony rozwój (domyślne) oferuje ulepszone zarządzanie danymi,
          które określają rodzaj rozwoju i automatycznie obliczają rangę postaci.
          Rozwój Legacy to po prostu duże pole tekstowe, w którym możesz napisać,
          co chcesz, bez zarządzania danymi.
      Unshake:
        Title: Modyfikator wyjścia z Szoku
        Content: Dodaje premię do automatycznego rzutu na Szok, który jest wywoływany
          na początku tury postaci W Szoku.
      Soak:
        Title: Modyfikator Wyparowania
        Content: Dodaje premię do rzutu na Wyparowanie, który jest wywoływany przez
          przycisk odbierający obrażenia na kartach obrażeń.
      Initiative:
        Title: Modyfikatory Inicjatywy
        Content: Modyfikuje sposób obsługi inicjatywy postaci zgodnie z zasadami zawartymi
          w podstawowej książce zasad.
      AutoCalc:
        Title: Automatyczne wyliczenia
        Content: Przełącza, czy statystyki postaci są obliczane na podstawie jej atrybutów
          i wyposażenia, czy ustalane ręcznie.
    ADDSTATS:
      Title: Dodatkowe Statystyki
      Description: Naucz się jak skonfigurować Dodatkowe Statystyki w swoim świecie
        gry
      Actor: Przewodnik po Dodatkowych Statystykach Demonstracyjna Postać
      GameSettings:
        Title: Ustawienia Gry
        Content: Na początek Dodatkowe Statystyki muszą być skonfigurowane w Ustawieniach
          Systemu.
      SwadeSettings:
        Title: Ustawienia SWADE
        Content: Dodatkowe Statystyki znajdują się w ustawieniach <em>Savage Worlds</em>.
      StatSettings:
        Title: Konfiguracja Dodatkowych Statystyk
        Content: Wszystkie statystyki muszą najpierw zostać utworzone na tej stronie,
          aby mogły być później włączone dla aktorów i przedmiotów.
      StatKey:
        Title: Klucz statystyki
        Content: Klucze statystyk określają, jak dodatkowa statystyka jest oznaczona
          w danych (actor.system.additionalStats.stat-key) i muszą być unikalne.
      StatLabel:
        Title: Etykieta
        Content: Tekst, który będzie wyświetlany na karcie postaci.
      StatDType:
        Title: Typ
        Content: Każdy typ ma unikalne zasady.
      HasMax:
        Title: Ma maksymalną wartość
        Content: Dodaje pole do wskazania maksymalnej wartości dodatkowej statystyki
          oraz jej bieżącej wartości (dostępne tylko dla Liczb i Tekstu).
      ActorDisplay:
        Title: Dodatkowe Statystyki na karcie Aktora
        Content: Dodatkowe statystyki, które są włączone dla postaci, wyświetlają
          się w zakładce Podsumowania.
      Checkbox:
        Title: Dodatkowe Statystyki - Pole Wyboru
        Content: Pole Wyboru może zawierać wartości prawdę i fałsz.
      Number:
        Title: Dodatkowe Statystyki - Liczba
        Content: Akceptowana jest każda liczba, w tym liczby dziesiętne.
      Die:
        Title: Dodatkowe Statystyki - Kość
        Content: Pierwsze pole akceptuje każdy prawidłowy zapis rzutu kostką w Foundry;
          dodaj „x”, aby kostka eksplodowała (np. 1d6x). Drugie pole to liczba, która
          jest dodawana do wyniku. Kliknij etykietę, aby wykonać rzut kostką.
      Text:
        Title: Dodatkowe Statystyki - Tekst
        Content: Proste pole tekstowe; szerokość nie jest zbyt duża, więc długie fragmenty
          tekstu powinny być umieszczane w opisie lub innych polach.
      Selection:
        Title: Dodatkowe statystyki - Wybór
        Content: Stała lista opcji oparta na ustawieniach gry.
      AccessTweaks:
        Title: Włączanie i Wyłączanie Dodatkowych Statystyk
        Content: Dodatkowe Statystyki mogą być włączane lub wyłączane w zakładce Dodatkowe
          Statystyki w menu Poprawek.
      AddStatTweaks:
        Title: Zakładka Dodatkowe Statystyki
        Content: Każda dodatkowa statystyka jest domyślnie wyłączona i musi być włączana
          indywidualnie dla każdego aktora lub przedmiotu.
    AURAS:
      Title: Aury
      Description: Wprowadzone w wersji 3.2, Aury tworzą trwałe wizualizacje, które
        podążają za tokenami.
      Actor: Przewodnik po Aurach Demonstracyjna Postać
      AccessAuras:
        Title: Dostęp do Aur
        Content: Aury można znaleźć w menu Poprawek
      Auramancer:
        Title: Zakładka Aur
        Content: Aury mają swoją własną zakładkę w menu Poprawek. Postacie mogą mieć
          maksymalnie dwie aury.
      Enable:
        Title: Włączanie Aur
        Content: Każda aura może być włączana indywidualnie; działają również w pełni
          z niezwiązanymi tokenami, co pozwala na ustawienie aur osobno, nawet jeśli
          mają wspólne źródło aktora.
      Constrained:
        Title: Ograniczenie Ścianami
        Content: Ten przełącznik decyduje, czy aura jest ograniczona przez ściany
          blokujące światło, czy może przez nie przechodzić.
      Radius:
        Title: Promień Aury
        Content: Promień aury, mierzony w jednostkach siatki. Wskazówka jednostki
          wyświetlana tutaj odpowiada jednostce miary bieżącej sceny.
      Color:
        Title: Kolor i Przezroczystość Aury
        Content: Aury wyświetlają się podobnie do okrągłych szablonów obszaru wokół
          postaci źródłowej; te ustawienia pozwalają kontrolować ich wizualny wygląd.
      Visibility:
        Title: Widoczność Aury
        Content: Wybierz, które tokeny (według nastawienia) mogą zobaczyć tę aurę.
          Zawsze możesz zobaczyć wszystkie aury tokenu, do którego masz przynajmniej
          uprawnienia Obserwatora.
    ADVANCES:
      Title: Rozwinięcia
      Description: Naucz się jak SWADE śledzi rozwinięcia postaci
      Actor: Przewodnik po Rozwinięciach Demonstracyjna Postać
      AccessAdvanceMode:
        Title: Ustawianie Typu Rozwinięć
        Content: Typ Rozwinięć postaci można przełączyć w menu Poprawek.
      Mode:
        Title: Wybór Rodzaju Rozwinięć
      AdvanceTab:
        Title: Zakładka Rozwinięć
        Content: Rozwinięcia są konfigurowane w głównej zakładce „Dziennik”.
      Create:
        Title: Tworzenie Rozwinięcia
        Content: Ten przycisk tworzy nowe rozwinięcie do wykorzystania
      Editor:
        Title: Edytor Rozwinięć
        Content: Ten formularz umożliwia konfigurację nowego rozwinięcia.
      Type:
        Title: Wybór Typu Rozwinięcia
        Content: Wybierz, jaki to rodzaj rozwinięcia. Obecnie nie uruchamia to dodatkowej
          walidacji ani wyboru, ale przyszłe aktualizacje systemu mogą to zmienić.
      Rank:
        Title: Ranga Rozwinięcia
        Content: Ranga, jaką twoja postać osiągnie po zdobyciu tego rozwinięcia. Nie
          można jej edytować bezpośrednio, ponieważ jest wyliczana na podstawie całkowitej
          liczby postępów twojej postaci.
      Number:
        Title: Numer Rozwinięcia
        Content: To ustawienie kontroluje kolejność rozwinięć. Zmiana tej wartości
          przeniesie postęp na wcześniejsze miejsce na liście.
      Planned:
        Title: Planowane Rozwinięcia
        Content: Możesz oznaczyć postępy jako zaplanowane, aby nie były liczone do
          rangi twojej postaci.
      Notes:
        Title: Notatki Rozwinięcia
        Content: Zamieść tutaj wszelkie istotne informacje dotyczące twojego rozwinięcia;
          jakie cechy zwiększyłeś, jakie przewagi wybrałeś itp.
      SaveChanges:
        Title: Przycisk Zapisu Zmian
        Content: Zmiany NIE są automatycznie zapisywane na postaci. Musisz użyć przycisku
          zapisu w edytorze ProseMirror lub tego przycisku „Zapisz zmiany”
    HEADQUARTERS:
      Title: Siedziby
      Description: Dowiedz się o nowym typie strony w dzienniku, Siedziba! Przydatne
        dla fortec w <em>Fantasy Companion</em>, schronisk w <em>Horror Companion</em>
        i baz w <em>Super Powers Companion</em>.
      JournalEntry: Przewodnik po Siedzibach Dziennik
      HeadquartersPage: Przewodnik po Siedzibach Strona
      CreateJournal:
        Title: Stwórz Dziennik
        Content: Siedziba musi być tworzona w ramach nadrzędnego dziennika.
      CreatePage:
        Title: Stwórz stronę Siedziby
        Content: Siedziby są nowym typem strony w dzienniku, podobnie jak tekst, obraz
          i PDF.
      HQPage:
        Title: Strona Siedziby
        Content: Siedziby są podobne do stron tekstowych, ale oferują bardziej strukturalne
          wprowadzenie. Sekcje są wzorowane na czterech krokach przedstawionych w
          każdym z podręczników.
      Advantage:
        Title: Przewagi
        Content: Konkretne przewagi zależą od gatunku, w który grasz; możesz przeciągnąć
          wyniki rzutów do tej sekcji.
      Complication:
        Title: Problemy
        Content: Podobnie jak w przypadku przewag, możesz przeciągnąć wyniki rzutów
          do tej sekcji.
      Form:
        Title: Formularz
        Content: Sekcja formularza jest podzielona na trzy części, abyś miał miejsce
          na opisanie każdego aspektu swojej siedziby.
      Upgrades:
        Title: Ulepszenia
        Content: Możesz wymienić swoje ulepszenia tutaj. To pole akceptuje pełne formatowanie
          HTML, więc możesz użyć listy punktowanej, tabeli lub innego systemu organizacyjnego,
          który ci odpowiada.
