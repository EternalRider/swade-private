      Hint: >-
        Drücke diese Taste(n) um einen Benny auszugeben. Halte dabei ALT
        gedrückt um statdessen einen Benny zu bekommen
    OpenFavoriteCards:
      Hint: Die favorisierte Kartenhand kann in der Userkonfiguration gesetzt werden
      Name: Favorisierte Kartenhand öffnen
      NoCardsWarning: Es wurde keine favorisierte Kartenhand gesetzt!
      UserConfigLabel: Favorisierte Kartenhand
  Settings:
    HighlightTemplate:
      Name: Schablonen immer ausmalen
      Hint: >-
        Wenn diese Einstellung eingeschaltet ist werden Schablonen immer voll
        ausgemalt anstatt nur das Raster
    FantasyCompanionEntangle:
      Name: Festgehalten Status nach Fantasy Companion
      Hint: >-
        Verwende die Fantasy Companion Version des Festgehalten Status. Die
        Seite muss neu geladen werden, damit die Änderung in Kraft tritt.
    InitDiscardPile:
      Name: Initiative-Ablagestapel
    InitCardDeck:
      Name: Aktionskartendeck
    ParryBase:
      Name: Parade-Fertigkeit
      Hint: >-
        Der Name der Fertigkeit die zur Berechnung des Paradewerts benutzt wird
        (Normalerweise Kämpfen)
    UseShortenedAttributes:
      Name: Attributsnamen abkürzen
      Hint: >-
        Wenn du diese Option aktivierst, werden die Attribute auf dem SC und NSC
        Bogen als Abkürzungen angegeben, also Ges statt Geschicklichkeit, Ver
        statt Verstand, etc. Schließe und öffne alle offenen Bögen wenn du diese
        Einstellung änderst.
    WeightUnit:
      Name: Gewichtseinheit
      Hint: >-
        Gib an ob Gewichtsangaben in Pfund (Imperial) oder Kilogramm (Metrisch)
        gerechnet werden
    HideNpcItemChatCards:
      Name: Verstecke NSC Item Chat Karten
      Hint: >-
        Wenn diese Option aktiviert ist, werden Chat-Karten für NSC-Items
        automatisch als Flüstern an alle Spielleiter gesendet, anstatt für alle
        sichtbar zu sein
    EnableBennyNotify:
      Name: Nachrichten zu Bennys
      Hint: Zeige Chatnachricht beim Nehmen, Einsetzen oder Auffrischen von Bennys
    HideWC:
      Name: NSC Wildcards verstecken
      Hint: Spielern nicht anzeigen, welche NSCs Wildcards sind
    CreateInitChat:
      Name: Chatnachrichten für Initiative
    AutoInit:
      Name: Automatische Initiative
      Hint: Aktionskarten jede Runde automatisch ziehen
    CardSound:
      Name: Kartengeräusch
      Hint: Kartengeräusch beim Ziehen der Initiative-Aktionskarten abspielen
    Benny3DFront:
      Name: Vordere Textur
      Hint: Vordere Textur des Bennys
    Benny3DBack:
      Name: Hintere Textur
      Hint: Hintere Textur des Bennys
    Benny3DBackBump:
      Name: Bump Map Rückseite
      Hint: Bump Map der Rückseite
    Benny3DFrontBump:
      Hint: Bump Map der Vorderseite
      Name: Bump Map Vorderseite
    CoreSkillsList:
      Name: Liste der Grundfertigkeiten
      Hint: >-
        Gib hier die Namen der Grundfertigkeiten deines Settings an. Zum
        Beispiel so: Allgemeinwissen, Athletik, Heimlichkeit, Überreden,
        Wahrnehmung
    CoreSkillsPack:
      Name: Kompendium mit Grundfertigkeiten
      Hint: Wähle aus, aus welchem Kompendium die Grundfertigkeiten bezogen werden
    WealthType:
      Name: Kapitalsystem
      Hint: >-
        Wähle aus welches System zur Buchführung auf dem Charakterbogen genutzt
        werden soll
    CurrencyName:
      Name: Währungsname
      Hint: Benenne die gängigste Währung deines Settings
    JokersWild:
      Name: Bennys für Joker
      Hint: >-
        Wenn diese Option aktiviert ist, werden Bennys verteilt wenn ein Joker
        als Aktionskarte gezogen wird.
    AmmoManagement:
      Name: Munitionsmanagement
      Hint: >-
        Wenn diese Option aktiviert (und anwendbar) ist, wird die Munition vom
        Magazin der Waffe abgezogen. Gegenstandskarten im Chat erhalten außerdem
        eine Schaltfläche zum nachladen und du kannst die Waffe nicht verwenden
        wenn nicht genügend Munition verfügbar ist
    PCAmmoFromInventory:
      Name: SCs laden Munition aus ihrem Inventar nach
      Hint: >-
        Wenn diese Option aktiviert ist, kann die Option zum Einstellen eines
        "Ausrüstung" gegenstands als Munition festgelegt werden und wird beim
        Nachladen der Waffe verwendet
    NPCAmmoFromInventory:
      Name: NSCs laden Munition aus ihrem Inventar nach
    VehicleAmmoFromInventory:
      Name: Fahrzeuge nutzen Munition aus ihrem Inventar
    EnableWoundPace:
      Name: Wunden beeinflussen Bewegung
      Hint: Wenn aktiviert, wird die Bewegung automatisch durch Wunden angepasst
    EnableConv:
      Name: Entschlossenheit
      Hint: Settingregel "Entschlossenheit" verwenden
    NoPowerPoints:
      Name: Keine Machtpunkte
      Hint: >-
        Wenn diese Option aktiviert ist, werden alle Machtpunkt-Interaktionen
        ausgeblendet
    AlwaysGeneralPP:
      Name: Immer generelle Machtpunkte anzeigen
      Hint: >-
        Wenn diese Option aktiviert ist, wird der Mächte Abschnitt "Generell"
        immer angezeigt, selbst wenn alle Mächte einen zugeordneten Arkanen
        Hintergrund haben
    ApplyEncumbrance:
      Name: Belastungsabzüge anwenden
      Hint: >-
        Wende belatungsabzüge an. Bitte beachtet das {vigor}sproben zum
        Widerstand gegen {fatigue} derzeit NICHT unterstüzt sind
    GmBennies:
      Name: Spielleiter Bennys
      Hint: Anzahl Bennys die du als SL beim auffrischen selbiger erhälst
    VehicleMods:
      Name: Fahrzeug-Modifikationen
      Hint: Fahrzeuge nutzen Modifikations-Plätze
    VehicleEdges:
      Name: Fahrzeug-Talente
      Hint: Fahrzeuge nutzen Talente und Handicaps
    BennyImageSheet:
      Name: Benny
      Hint: >-
        Wählt welches Bild verwendet wird um den Benny am Charakterbogen
        darzustellen
    HardChoices:
      Name: Schwere Entscheidungen
      Hint: Schaltet die Schwere Entscheidungen Settingregel ein
    UseAttributeShorts:
      Hint: >-
        Aktivieren Sie diese Option, wenn Sie abgekürzte Attributnamen auf den
        PC- und NPC-Bögen sehen möchten, z. B. Agi statt Beweglichkeit, Sma
        statt Smarts usw. Sie müssen alle geöffneten Bögen schließen und erneut
        öffnen, damit diese Option wirksam wird.
      Name: Verkürzte Attributnamen verwenden
    StartingCurrency:
      PC:
