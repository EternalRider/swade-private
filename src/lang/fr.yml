  Settings:
    HighlightTemplate:
      Name: Toujours surligner les gabarits
      Hint: Quand l’option est activée, les gabarits de mesure sont toujours surlignés,
        au lieu de la grille.
    FantasyCompanionEntangle:
      Name: Statut Entravé du Compagnon Fantasy
      Hint: Utiliser le statut Entravé du Compagnon Fantasy au lieu de celui du livre
        de base. Changer ce paramètre nécessite un rechargement
