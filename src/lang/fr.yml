      Name: Héros sans armure
      Hint: Cocher cette option activera la règle d'univers Héros sans armure lors
        des jet d'encaissement
    WoundCap:
      Hint: Cocher cette option, active la règle d'univers Limite de blessures lors
        du calcul des blessures.
      Name: Limite de blessures
    InjuryTable:
      Name: Tables des blessures
      Hint: Sélectionnez la table correspondante pour les jets automatiques des Dégâts
        handicapants.
    GrittyDamage:
      Name: Dégâts handicapants
      Hint: Cocher cette option, active la règle d'univers des Dégâts handicapants
        et permet de choisir la table des blessures à utiliser.
    HeroesNeverDie:
      Name: Les héros ne meurent jamais
      Hint: Cocher cette option active la règle d'univers les Héros de meurent jamais
        quand le système vérifie l'état d'incapacité
    DumbLuck:
      Name: Chance insolente
      Hint: Cocher cette option activera la règle d'univers Chance insolente
    VehicleSkills:
      Name: Compétences de manœuvre
      Hint: Saisissez une liste de compétences séparées par une virgule pour définir
        les compétences de manœuvre pour chaque véhicule
