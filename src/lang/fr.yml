      Name: Défausse de l'initiative
    InitCardDeck:
      Name: Jeu de cartes pour l'initiative
    ParryBase:
      Name: Nom de la compétence de combat
      Hint: Le nom de la compétence utilisée pour calculer la parade
    UseAttributeShorts:
      Name: Utiliser des noms d'attributs courts
      Hint: Activez cette option si vous voulez des noms d'attributs courts sur les
        fiches des PJs et des PNJs (c.a.d. Agi au lieu d'Agilité ...). Vous devez
        rouvrir toutes les fiches ouvertes pour que cette option prenne effet.
    WeightUnit:
      Name: Unité de poids
      Hint: Indique si les poids sont mesurés en livres ou en kilogrammes. Changer
        ce paramètre ne changera PAS le poids des objets, uniquement le calcul de
        l'encombrement
    HideNpcItemChatCards:
      Name: Cacher les cartes de la discussion d'objets des PNJ
      Hint: Quand l'option est activée, les cartes de la discussion d'objets des PNJ
        sont automatiquement envoyées en message privé à tous les meneurs de jeu au
        lieu d'être envoyées dans la discussion publique
    EnableBennyNotify:
      Name: Notifications des jetons
      Hint: Affiche des messages dans la discussion lorsque les jetons sont modifiés.
    HideWC:
      Name: Cache le signe Joker des PNJ
      Hint: Ne montre pas aux joueurs le signe Joker des PNJ
    CreateInitChat:
      Name: Créer un message dans la discussion pour l'initiative
      Hint: Quand les cartes d'actions sont tirées, Foundry affichera le tirage des
        cartes dans le chat si autorisé.
    AutoInit:
      Name: Initiative automatique
      Hint: Pioche automatiquement l'initiative à chaque tour
