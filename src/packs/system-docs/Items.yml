text:
  content: >-
    <p>
      Items are the components with which you can create and equip actors in
      Foundry. They can be created in the Items Directory or directly on actor
      sheets, and they can be dragged between both locations for easy sharing.
    </p>
    <p>
      The free SWADE system already includes items for Hindrances, Edges, and
      Skills, but the content descriptions include only page references. Other items
      such as Gear, Armor, Shields, Weapons, and Powers are available in the
      <em>Savage Worlds Adventure Edition</em> compendium
      <a
        href="https://peginc.com/store/savage-worlds-adventure-edition-core-rules-foundry-vtt/"
        title="SWADE CORE FVTT"
        >package</a
      >.
    </p>
    <h2>Creating Items</h2>
    <p>
      You can create items either in the Items Directory or directly on the
      character sheet.
    </p>
    <h3>In the Items Directory</h3>
    <p>
      For GMs, it’s best to create an item in the Items Directory before attempting
      to add it to a character sheet. This is true for several reasons:
    </p>
    <ol>
      <li>
        You can reuse the item among multiple actors more easily by dragging and
        dropping them.
      </li>
      <li>You can organize them in folders.</li>
      <li>
        Currently, Actions &amp; Effects cannot be added to items that are owned by
        a character, i.e. on the character’s sheet. They can only be added to items
        in the Items Directory.
      </li>
    </ol>
    <h3>On the Character Sheet</h3>
    <p>
      Players likely do not have the permissions needed to create items in the Items
      Directory. In that case, create items for an individual character directly on
      the sheet.
    </p>
    <h4>Reusing Character Items</h4>
    <p>
      You can save an item on a character’s sheet to the Items Directory in the
      sidebar simply by dragging and dropping it to the Items Directory. This makes
      a copy of the item which can then be dragged to other character sheets when
      needed.
    </p>
    <h2>Hindrances</h2>
    <p>The basic fields for a Hindrance include the following:</p>
    <ul>
      <li><strong>Name:</strong> The name of the Hindrance.</li>
      <li>
        <strong>Major Hindrance:</strong> A checkbox to indicate whether or not it
        is a Major Hindrance. If this is left unchecked, it will be regarded as a
        Minor Hindrance.
      </li>
      <li><strong>Description:</strong> The details about the Hindrance.</li>
    </ul>
    <h2>Edges</h2>
    <p>The basic fields for Edges include the following:</p>
    <ul>
      <li><strong>Name:</strong> The name of the Edge</li>
      <li>
        <strong>Requirements:</strong> The Rank, Skill, Edge, or other requirements
        needed to be able to take the Edge.
      </li>
      <li>
        <strong>Arcane Background:</strong> A checkbox indicating whether or not
        this Edge is an Arcane Background.
      </li>
      <li>
        <strong>Description:</strong> The details and description of the Edge.
      </li>
    </ul>
    <h2>Skills</h2>
    <p>The basic fields for Edges include the following:</p>
    <ul>
      <li><strong>Name:</strong> The name of the Skill.</li>
      <li><strong>Die:</strong> The die type of the Skill.</li>
      <li>
        <strong>Modifier:</strong> Any permanent modifier applied to the skill. For
        example, if the Skill’s die type is d12+1, this would contain the +1
        modifier.
      </li>
      <li>
        <strong>Linked Attribute:</strong> The Attribute to which the Skill is
        linked.
      </li>
      <li>
        <strong>Wild Die:</strong> Usually a d6, but you can specify a different die
        type if there are special circumstances in which a specific skill has a
        different die type for the Wild Die.
      </li>
      <li>
        <strong>Description:</strong> The details and description of the Skill.
      </li>
    </ul>
    <h2>Gear</h2>
    <p>The basic fields for Gear include the following:</p>
    <ul>
      <li><strong>Name:</strong> The name of the item.</li>
      <li>
        <strong>Equippable:</strong> Determines whether the item can be equipped.
      </li>
      <li>
        <strong>Vehicle Mod:</strong> Determines whether the item can be added to a
        vehicle actor’s Modifications list (see System Settings).
      </li>
      <li><strong>Cost:</strong> The monetary purchase value of the item.</li>
      <li>
        <strong>Weight:</strong> The weight of the item for calculating encumbrance.
      </li>
      <li>
        <strong>Quantity:</strong> How many of this item the character has in her
        inventory.
      </li>
      <li>
        <strong>Description:</strong> The details and description of the item.
      </li>
    </ul>
    <h2>Armor</h2>
    <p>The basic fields for Armor include the following:</p>
    <ul>
      <li><strong>Name:</strong> The name of the armor.</li>
      <li>
        <strong>Equipped:</strong> Determines whether the armor is equipped for the
        purposes of automatically calculating Toughness.
      </li>
      <li><strong>Armor:</strong> The actual bonus the armor grants.</li>
      <li><strong>Cost:</strong> The monetary purchase value of the armor.</li>
      <li>
        <strong>Weight:</strong> The weight of the armor for calculating
        encumbrance.
      </li>
      <li>
        <strong>Quantity:</strong> How many of this type of armor the character has
        in her inventory.
      </li>
      <li>
        <strong>Min. Str:</strong> The minimum Strength required to wear the armor
        effectively.
      </li>
      <li><strong>Notes:</strong> Any special notes about the armor.</li>
      <li>
        <strong>Natural Armor:</strong> Determines whether or not this armor is
        considered natural armor for stacking and equipping purposes.
      </li>
      <li>
        <strong>Hit Locations:</strong> Specifies which parts of the body the armor
        protects for the purposes of called shots.
      </li>
      <li>
        <strong>Description:</strong> The details and description of the armor.
      </li>
    </ul>
    <h2>Shields</h2>
    <ul>
      <li><strong>Name:</strong> The name of the shield.</li>
      <li>
        <strong>Equipped:</strong> Determines whether the shield is equipped for the
        purposes of automatically calculating Toughness.
      </li>
      <li>
        <strong>Cover:</strong> Assigns the amount of cover the shield grants when
        equipped.
      </li>
      <li>
        <strong>Parry:</strong> Assigns the bonus to Parry the shield grants when
        equipped.
      </li>
      <li><strong>Cost:</strong> The monetary purchase value of the shield.</li>
      <li>
        <strong>Weight:</strong> The weight of the shield for calculating
        encumbrance.
      </li>
      <li>
        <strong>Quantity:</strong> How many of this type of shield the character has
        in her inventory.
      </li>
      <li>
        <strong>Min. Str:</strong> The minimum Strength required to wield the shield
        effectively.
      </li>
      <li><strong>Notes:</strong> Any special notes about the shield.</li>
      <li>
        <strong>Description:</strong> The details and description of the shield.
      </li>
    </ul>
    <h2>Weapons</h2>
    <ul>
      <li><strong>Name:</strong> The name of the weapon.</li>
      <li>
        <strong>Vehicular Weapon:</strong> Enables a vehicle to equip the weapon.
      </li>
      <li>
        <strong>Equipped:</strong> Determines whether the weapon is equipped for the
        purposes of automatically calculating Toughness.
      </li>
      <li>
        <strong>Shots:</strong> The amount of ammunition the weapon has. The two
        fields are current and maximum.
      </li>
      <li>
        <strong>Damage:</strong> The amount of damage the weapon deals. This should
        be written as a dice expression such as <code>d6 + 1</code>. If the weapon
        includes Strength damage, prepend the damage with <code>@str +</code> so
        that the die roller rolls the character’s Strength accordingly.
      </li>
      <li>
        <strong>Range:</strong> The range increments of the weapon, usually written
        as 12/24/48 for example.
      </li>
      <li><strong>RoF:</strong> The maximum Rate of Fire of the weapon.</li>
      <li><strong>AP:</strong> The amount of Armor the weapon can ignore.</li>
      <li><strong>Cost:</strong> The monetary purchase value of the weapon.</li>
      <li>
        <strong>Weight:</strong> The weight of the weapon for calculating
        encumbrance.
      </li>
      <li>
        <strong>Quantity:</strong> How many of this type of weapon the character has
        in her inventory.
      </li>
      <li>
        <strong>Min. Str:</strong> The minimum Strength required to wield the weapon
        effectively.
      </li>
      <li><strong>Notes:</strong> Any special notes about the weapon.</li>
      <li>
        <strong>Description:</strong> The details and description of the weapon.
      </li>
    </ul>
    <h2>Powers</h2>
    <ul>
      <li><strong>Name:</strong> The name of the power.</li>
      <li>
        <strong>P. Points:</strong> The minimum amount of Power Points it costs to
        activate the power.
      </li>
      <li>
        <strong>Range:</strong> The maximum range at which the power can be used.
      </li>
      <li>
        <strong>Duration:</strong> The default length of time the power lasts.
      </li>
      <li><strong>Damage:</strong> The amount of damage the power inflicts.</li>
      <li>
        <strong>Arcane:</strong> The name of the Arcane Skill used to activate the
        power. This is also how powers are grouped on the actor’s character sheet.
      </li>
      <li><strong>Trappings:</strong> The unique trapping of the power.</li>
      <li>
        <strong>Description:</strong> The details and description of the power,
        including modifiers.
      </li>
    </ul>
    <h2>Actions and Effects</h2>
    <p>Items of all types have an Actions and Effects tab.</p>
    <p>
      Some items include a field for a default Skill rolled to use the item. When a
      Chat card for the item is displayed, this Skill is included as a button on the
      card. Clicking that button rolls the respective character’s Skill.
    </p>
    <p>
      Additional Actions also include fields for a default Skill or damage
      modifiers.
    </p>
    <h3>Actions</h3>
    <p>
      Some items can have multiple actions. For example, a particular ranged weapon
      might have a Rate of Fire which would apply a penalty to the Shooting roll and
      consume a number of shots. Other items might have different damage determined
      by range or ammo used. All of these can be defined in the Actions list, and
      all would also appear on the Chat card as buttons for rolling Skills or
      damage.
    </p>
    <h3>Active Effects</h3>
    <p>Documentation coming soon!</p>
