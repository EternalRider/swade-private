name: Rolling Inline Roll Attributes
ownership:
  default: -1
sort: 300000
src: null
system: {}
text:
  content: >-
    <p>
      You can roll dice directly from the chat using the <code>/roll</code> or
      <code>/r</code> command. When rolling via the chat, it's possible to build
      inline macros so that you can roll any attribute or skill directly.
    </p>
    <hr />
    <p>
      <strong>Example:</strong> Rolling your character's Strength die with a +4
      modifier
    </p>
    <p><code>/r @str + 4</code></p>
    <hr />
    <p>
      These <code>@</code> shortcuts are called RollData or Roll Attributes. A list
      of them is provided below:
    </p>
    <ul>
      <li>Strength: <code>@str</code></li>
      <li>Agility: <code>@agi</code></li>
      <li>Smarts: <code>@sma</code></li>
      <li>Spirit: <code>@spi</code></li>
      <li>Vigor: <code>@vig</code></li>
      <li>Wounds: <code>@wounds</code></li>
      <li>Fatigue: <code>@fatigue</code></li>
      <li>Skills: <code>@skill-slug</code>*</li>
    </ul>
    <p>
      *A slug is a name that is converted to all lowercase with spaces replaced with
      <code>-</code>. "Shooting" becomes <code>@shooting</code>. "Weird Science"
      becomes <code>@weird-science</code>.
    </p>
    <p>
      For more examples on how to format rolls in chat, visit the
      <a
        rel="nofollow noreferrer noopener"
        href="https://foundryvtt.com/article/dice/"
        target="_blank"
        >Foundry VTT website</a
      >.
    </p>
