text:
  content: >-
    <h2>Tweaks</h2>
    <p>
      Character sheets have a Tweaks option in the title bar of their respective
      panels. Within the Tweaks settings panel, you’ll find a number of options to
      customize the character and its sheet.
    </p>
    <ul>
      <li>
        <strong>Animal Smarts:</strong> Appends an A to the Smarts Attribute to
        indicate the actor has Animal Smarts.
      </li>
      <li>
        <strong>Running Die:</strong> Sets the die type rolled and any modifiers for
        Running die rolls.
      </li>
      <li>
        <strong>Max Wounds:</strong> Sets the maximum number of Wounds the character
        can have before becoming Incapacitated.
      </li>
      <li>
        <strong>Max Fatigue:</strong> Sets the maximum level of Fatigue the
        character can have before becoming Incapacitated.
      </li>
      <li>
        <strong>Bennies Reset:</strong> Sets the number of Bennies the character has
        at the start of a session or when bennies are refreshed.
      </li>
      <li>
        <strong>Ignore Wounds:</strong> Used to indicate how many points of Wound
        penalties to ignore based on any Edges or abilities the character might
        have.
      </li>
    </ul>
    <h3>Initiative</h3>
    <p>
      These options affect how drawing Action Cards for Initiative is handled for
      the given character, respecting the rules for those Edges and Hindrances
      accordingly. See Running Savage Worlds in Foundry VTT for more details.
    </p>
    <h3>Automatic Calculations</h3>
    <p>
      <strong>Toughness:</strong> Automatically calculates stacking of Armor from
      any armor items equipped and adds it to the character’s base Toughness. This
      can be useful if characters don and doff armor from various sources during a
      session.
    </p>
    <h3>Additional Stats</h3>
    <p>
      Displays fields for Additional Stats as defined in the System Settings’
      Setting Configurator.
    </p>
    <h2>Prototype Token</h2>
    <p>
      You can configure your character’s default token directly from the sheet via
      the Prototype Token option in the character sheet’s title bar.
    </p>
    <p>
      Details about Prototype Tokens can be found on the
      <a
        rel="nofollow noreferrer
        noopener"
        href="https://foundryvtt.com/article/tokens/"
        target="_blank"
        >Foundry VTT website</a
      >.
    </p>
    <h2>Character Sheet Header</h2>
    <p>
      There are a handful of fields available at the top of the character sheet,
      specifically the following:
    </p>
    <ul>
      <li>Race</li>
      <li>Rank</li>
      <li>Advances</li>
    </ul>
    <p>
      Additionally, if the Convictions setting configuration is enabled in Setting
      Configurator as noted above, the character sheet header will include a field
      for that value as well.
    </p>
    <h2>Summary Tab</h2>
    <p>
      The Summary tab is essentially where all the action happens. This tab is
      primarily geared toward combat and Trait rolls. It includes fields for:
    </p>
    <ul>
      <li>tracking Wounds and Fatigue,</li>
      <li>applying Statuses,</li>
      <li>tracking and spending Bennies,</li>
      <li>setting values for Attributes and Derived Statistics,</li>
      <li>adding and rolling Skills, and</li>
      <li>
        accessing equipped gear and favorited powers/effects (see Powers Tab below).
      </li>
    </ul>
    <h3>Wounds and Fatigue</h3>
    <p>
      These two fields allow you to track the Wounds and Fatigue a character has at
      any given time. These values will apply penalties to Trait rolls
      appropriately. You can also use arrow keys on the keyboard to increment or
      decrement the selected values.
    </p>
    <h3>Statuses</h3>
    <p>
      This section of the sheet provides an array of Statuses that can be checked to
      indicate whether or not they are to be applied to the character. These
      statuses <em>do not</em> synchronize status icons with their linked tokens.
    </p>
    <h3>Bennies</h3>
    <p>
      Bennies can be spent simply by clicking on a Benny in the stack on the
      character sheet. (If the
      <a
        rel="nofollow noreferrer noopener"
        href="https://foundryvtt.com/packages/dice-so-nice/"
        target="_blank"
        ><em>Dice So Nice!</em></a
      >
      <a
        rel="nofollow noreferrer
        noopener"
        href="https://foundryvtt.com/packages/dice-so-nice/"
        target="_blank"
        >module</a
      >
      is installed and active, you’ll see a Benny thrown onto the scene.) You can
      add Bennies to the stack by clicking the <code>+</code> button next to them.
    </p>
    <h3>Attributes</h3>
    <h4>Setting Attributes</h4>
    <p>
      Clicking on the die type for a given Attribute allows you to change it. If an
      Attribute has a permanent modifier such as d12+2, you can add the modifier in
      the field adjacent to the die type.
    </p>
    <h4>Rolling Attributes</h4>
    <p>You can make a Trait roll with an Attribute by clicking on its name.</p>
    <h3>Derived Stats</h3>
    <p>
      The Derived Stats are based on those presented in the core rules with a few
      features.
    </p>
    <h4>Size</h4>
    <p>
      This is the Size value as per the Special Ability presented in the Bestiary of
      the core rules.
    </p>
    <h4>Running Die</h4>
    <p>
      Clicking on the label for Pace will roll the Running die and automatically add
      the character’s Pace to the result.
    </p>
    <h4>Parry</h4>
    <p>Parry includes any bonuses from weapons and shields</p>
    <h4>Toughness</h4>
    <p>
      Toughness and Armor are manually set values. If automatic calculation for
      Toughness is enabled, these values will be automatically derived from stats
      and equipped armor.
    </p>
    <h3>Skills</h3>
    <h4>Adding Skills</h4>
    <p>Skills can be added in one of two ways:</p>
    <ul>
      <li>
        Click the ‘+Add’ button at the top of the list and enter the details in the
        Skill sheet.
      </li>
      <li>
        Drag a previously created Skill from the Items Directory onto the sheet.
      </li>
    </ul>
    <p>
      To edit the Skill afterward, click on the die type of the skill. This will
      open the item sheet for the selected Skill.
    </p>
    <h4>Making Skill Rolls</h4>
    <p>
      To make a Skill roll, click the name of the Skill. A dialog window will
      display and allow you to enter any situational modifiers associated with the
      roll and choose the roll mode to determine who can see the roll result in the
      Chat (see the
      <a
        rel="nofollow noreferrer noopener"
        href="https://foundryvtt.com/article/dice/#modes"
        target="_blank"
        >Roll Modes</a
      >
      on the Foundry VTT website for more details).
    </p>
    <h4>Quick Access &amp; Effects</h4>
    <p>
      This section of the sheet features a list of equipped items and favorited
      powers.
    </p>
    <p>
      Each item in this list can be expanded by clicking on its name. Weapons in
      particular display an option to roll damage for that weapon.
    </p>
    <p>
      <strong>Chat Cards:</strong> These items also each have a chat icon that
      creates an interactive card in the Chat. This card includes a button to roll
      the Skill listed in the item’s action tab as well as the damage roll if any.
      If the item has additional actions defined, those options will also be listed
      on the card.
    </p>
    <h2>Edges (and Hindrances) Tab</h2>
    <p>This tab includes both the character’s Hindrances and Edges.</p>
    <p>
      Similarly to Skills, you have two methods for adding Hindrances and Edges:
    </p>
    <ul>
      <li>Click the “+Add” button to create new Edge or Hindrance Items.</li>
      <li>
        Drag and a previously created Edge or Hindrance from the Items Directory
        onto the sheet.
      </li>
    </ul>
    <h3>Editing Edges and Hindrances</h3>
    <p>
      To edit an Edge or Hinderance, click on the edit icon for the item. This will
      open the item sheet for the selected Edge or Hindrance.
    </p>
    <p>
      <strong>Chat Cards:</strong> Edges and Hindrances also each have a chat icon
      that creates an interactive card in the Chat. If the item has Actions and
      Effects defined, those options will be listed on the card.
    </p>
    <h2>Inventory Tab</h2>
    <h3>Encumbrance</h3>
    <p>
      Encumbrance displays the total amount of weight the character can carry before
      being encumbered and the current total weight of the items in the character’s
      inventory regardless of whether or not it’s equipped.
    </p>
    <h3>Currency</h3>
    <p>Currency stores the total amount of money the character has currently.</p>
    <h3>Inventory</h3>
    <p>The character’s inventory of items is grouped into five categories:</p>
    <ul>
      <li>Weapons</li>
      <li>Armors</li>
      <li>Shields</li>
      <li>Misc</li>
    </ul>
    <p>
      Each category has a button labeled “+Add” that allows you to manually enter an
      item directly to a character’s sheet instead of dragging and dropping an item
      from the Items Directory sidebar.
    </p>
    <p>
      Items in the inventory can be equipped, edited, or deleted using the icons to
      the right of each entry’s listing.
    </p>
    <p>
      Equipping an item adds the item to the Quick Access &amp; Effects tab on the
      Summary tab.
    </p>
    <p>
      Editing an item allows you to add details, change the quantity of items, and
      more (see Weapons for example).
    </p>
    <p>
      Deleting an item is permanent. Once the item is deleted, it cannot be
      recovered. If you think you might need that version of the item in the future,
      drag it to the Items Directory before deleting it from the character sheet.
    </p>
    <h2>Powers Tab</h2>
    <p>
      The Powers tab contains lists of powers and the number of Power Points for
      each Arcane Background the character has.
    </p>
    <p>
      The “+Add Powers” button allows you to add a new power. While adding the
      power, you can specify the Arcane Skill used to activate the power (see Powers
      for more details).
    </p>
    <p>
      A power can be added to the Quick Access &amp; Effects list on the Summary tab
      by clicking the star icon to the right of its listing.
    </p>
    <p>
      <strong>Chat Cards:</strong> Powers have a chat icon that creates an
      interactive card in the Chat. This card includes a button to roll the Arcane
      Skill associated with the power. If the item has additional actions defined,
      those options will also be listed on the card.
    </p>
    <h3>Deleting a Power</h3>
    <p>
      To delete a power, you have to first edit the power. The delete icon will
      appear in the upper right corner of the displayed sheet.
    </p>
    <h2>Description Tab</h2>
    <p>The Description Tab has three fields:</p>
    <ul>
      <li>
        <strong>Portrait:</strong> Click on the portrait field to select or upload
        an image of the character’s portrait.
      </li>
      <li>
        <strong>Advances:</strong> This rich text field allows you to track the
        character’s advances.
      </li>
      <li>
        <strong>Biography:</strong> Usually, this is where you can add your
        character’s backstory as well as a list of any special abilities the
        character has been granted.
      </li>
    </ul>
