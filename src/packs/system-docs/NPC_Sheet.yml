text:
  content: >-
    <p>
      NPC sheets are similar to the Character Sheet but much more compact and
      simplified. They are typically used for characters or creatures other than the
      player characters.
    </p>
    <h2>Tweaks</h2>
    <p>
      NPC sheets have the same settings in Tweaks as character sheets plus one
      additional field.
    </p>
    <p>
      <strong>Wild Card:</strong> Indicates whether or not the character or creature
      is a Wild Card. When checked, fields for tracking Bennies will be added to the
      sheet.
    </p>
    <h2>Prototype Token</h2>
    <p>
      You can configure a default token directly from the sheet via the Prototype
      Token option in the character sheet’s title bar.
    </p>
    <p>
      Details about Prototype Tokens can be found on the
      <a
        rel="nofollow noreferrer noopener"
        href="https://foundryvtt.com/article/tokens/"
        target="_blank"
        >Foundry VTT website</a
      >.
    </p>
    <h2>Items</h2>
    <p>
      All items on NPC sheets are displayed on the same page. You can add items to
      the NPC sheet by clicking on the “+” button in the respective section’s
      header.
    </p>
    <p>
      If the NPC sheet includes an Edge that is marked as an Arcane Background, a
      Powers tab will be added to the sheet, and the main tab will be grouped under
      a Summary tab.
    </p>
    <p>
      <strong>Note:</strong> The eye icon for each item behaves similarly to the
      chat icon on the character sheet. These icons will be redesigned in the near
      future to match the character sheet, including replacing the eye icon with the
      chat icon.
    </p>
