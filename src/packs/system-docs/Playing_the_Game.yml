    <h2>Combat Tracker</h2>
    <p>
      The SWADE system applies a couple of modifications to Foundry’s Combat Tracker
      to align it with Savage Worlds’ Initiative rules.
    </p>
    <p>Characters are given cards drawn from the Action Deck table.</p>
    <p>
      If a character has the Level Headed, Improved Level Headed, or Hesitant active
      in the Tweaks settings in their Actor sheet, the Combat Tracker will take into
      account those features.
    </p>
    <p>
      At the start of a new round, Action Cards are automatically drawn for each
      character. If a Joker was drawn in the previous round, the cards are shuffled
      (read: the table is reset) before Action Cards are distributed.
    </p>
    <h2>Rewarding Bennies</h2>
    <p>
      GMs can quickly reward Bennies from the Players List in the bottom left of the
      screen.
    </p>
    <p>
      To the right of each player listing is the number of Bennies they currently
      have. Clicking on this number increments the number of Bennies by one.
    </p>
    <p>
      Right-clicking on any player name displays a context menu with additional
      options:
    </p>
    <ul>
      <li>
        <strong>Give a Benny:</strong> Gives the player a single benny as above.
      </li>
      <li>
        <strong>Refresh Bennies:</strong> Resets the selected player’s characters’
        Bennies to their Bennies Reset value as indicated in their character sheet.
      </li>
      <li>
        <strong>Refresh All Bennies:</strong> Resets all player’s Bennies as above.
      </li>
    </ul>
    <h2>Using Blast and Cone Templates</h2>
    <p>
      The Savage Worlds Adventure Edition system for Foundry adds custom Blast and
      Cone Templates to the Measurement Controls toolbar. The icons for the
      templates are as follows:
    </p>
    <ul>
      <li><strong>C:</strong> Cone Template</li>
      <li><strong>S:</strong> Small Blast Template</li>
      <li><strong>M:</strong> Medium Blast Template</li>
      <li><strong>L:</strong> Large Blast Template</li>
    </ul>
    <p>
      For more information on how to use the area of effect templates in Foundry,
      see
      <a
        rel="nofollow noreferrer noopener"
        href="https://foundryvtt.com/article/measurement/"
        target="_blank"
        >Measurement and Templates on the Foundry VTT website</a
      >.
    </p>
